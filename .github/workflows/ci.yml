name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API, Phonics & Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Backend API & Phonics Test Dependencies
        run: |
          pip install --no-cache-dir fastapi httpx pytest pillow numpy arabic-reshaper python-bidi edge-tts requests pydantic python-multipart
      - name: Compile Python Modules
        run: |
          python -m py_compile backend/main.py interactive_explorer/explorer_app.py
      - name: Run Backend Test Suite
        run: |
          pytest -v backend/tests

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck & Build Next.js App
        working-directory: frontend
        run: |
          npm run lint
          npm run build
